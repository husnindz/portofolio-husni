<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="etl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Emerald / Teal Glow -->
    <linearGradient id="etl-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="etl-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="etl-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131B2B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0B101C" stop-opacity="0.85" />
    </linearGradient>

    <!-- Ambient Radials -->
    <radialGradient id="etl-rad-1" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="etl-rad-2" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="etl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#etl-bg)" rx="16" />
  <rect width="800" height="450" fill="url(#etl-rad-1)" rx="16" />
  <rect width="800" height="450" fill="url(#etl-rad-2)" rx="16" />

  <!-- Blueprint Line Grid -->
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Header Metadata -->
  <g transform="translate(40, 36)">
    <rect x="0" y="0" width="10" height="10" rx="3" fill="#10B981" />
    <text x="20" y="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">MODULAR ETL DATA PIPELINE</text>
    <text x="215" y="9" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">// EXTRACT → TRANSFORM → MULTI-DESTINATION LOAD</text>

    <!-- 90%+ Test Coverage Badge -->
    <rect x="575" y="-4" width="145" height="22" rx="11" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="589" cy="7" r="3.5" fill="#10B981" />
    <text x="600" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34D399">90%+ PYTEST VERIFIED</text>
  </g>

  <!-- STEP 1: EXTRACT (Web Scraping 50 Pages) -->
  <g transform="translate(40, 75)" filter="url(#etl-shadow)">
    <rect width="210" height="330" rx="12" fill="url(#etl-card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#06B6D4">01 · EXTRACT</text>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Multi-Page Scraping</text>

    <!-- Source Target Box -->
    <g transform="translate(18, 62)">
      <rect width="174" height="48" rx="8" fill="#080D16" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8">TARGET CATALOG</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F2FE">fashion-studio.dev</text>
    </g>

    <!-- Pagination & Requests stats -->
    <g transform="translate(18, 120)">
      <rect width="174" height="74" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Crawler Engine:</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F8FAFC">Requests + BS4</text>

      <text x="12" y="50" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Scraped Depth:</text>
      <text x="12" y="64" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981">Pages 1 – 50 Iterated</text>
    </g>

    <!-- Raw Data Attributes Stream -->
    <g transform="translate(18, 204)">
      <rect width="174" height="106" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#64748B">CAPTURED RAW SCHEMA</text>

      <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">▪ title: string</text>
      <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">▪ price: "$12.50" (raw USD)</text>
      <text x="12" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">▪ rating: "4.5 / 5.0"</text>
      <text x="12" y="84" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">▪ colors, size, gender</text>
      <text x="12" y="98" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F59E0B">⚠ Contains invalid sentinels</text>
    </g>
  </g>

  <!-- CONNECTOR PIPELINE ARROWS (Extract to Transform) -->
  <g opacity="0.85">
    <path d="M 250 170 L 290 170" fill="none" stroke="#00F2FE" stroke-width="2" />
    <path d="M 250 240 L 290 240" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- STEP 2: TRANSFORM (Data Cleansing & Normalization) -->
  <g transform="translate(290, 75)" filter="url(#etl-shadow)">
    <rect width="220" height="330" rx="12" fill="url(#etl-card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981">02 · TRANSFORM</text>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Data Cleansing Engine</text>

    <!-- Currency Conversion Card -->
    <g transform="translate(18, 62)">
      <rect width="184" height="64" rx="8" fill="#080D16" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8">CURRENCY NORMALIZER</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">USD → IDR (@ Rp16.000)</text>
      <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981">Rp200.000 (Numeric)</text>
    </g>

    <!-- Data Quality Filter Rules -->
    <g transform="translate(18, 136)">
      <rect width="184" height="88" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8">DATA PURIFICATION RULES</text>
      
      <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">✓ Drop "Unknown Product"</text>
      <text x="12" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">✓ Discard null &amp; duplicates</text>
      <text x="12" y="68" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">✓ Rating parsed to float</text>
      <text x="12" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">String trimming &amp; schema check</text>
    </g>

    <!-- Pytest Box -->
    <g transform="translate(18, 234)">
      <rect width="184" height="76" rx="8" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#34D399">PYTEST AUTOMATION SUITE</text>
      <text x="12" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">Mock Requests HTTP API</text>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC">Mock DB &amp; Google Sheets</text>
      <text x="12" y="66" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F2FE">Coverage: 90%+ Passed</text>
    </g>
  </g>

  <!-- CONNECTOR PIPELINE ARROWS (Transform to Multi-Load) -->
  <g opacity="0.85">
    <path d="M 510 160 L 550 130" fill="none" stroke="#00F2FE" stroke-width="2" />
    <path d="M 510 220 L 550 220" fill="none" stroke="#10B981" stroke-width="2" />
    <path d="M 510 280 L 550 310" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- STEP 3: MULTI-DESTINATION LOAD -->
  <g transform="translate(550, 75)" filter="url(#etl-shadow)">
    <rect width="210" height="330" rx="12" fill="url(#etl-card)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <text x="18" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00F2FE">03 · LOAD</text>
    <text x="18" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Multi-Destination</text>

    <!-- Destination 1: PostgreSQL -->
    <g transform="translate(18, 62)">
      <rect width="174" height="68" rx="8" fill="#080D16" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">PostgreSQL Database</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Relational Storage / SQLAlchemy</text>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06B6D4">Table: fashion_products</text>
      <circle cx="156" cy="20" r="4" fill="#06B6D4" />
    </g>

    <!-- Destination 2: Google Sheets API -->
    <g transform="translate(18, 140)">
      <rect width="174" height="68" rx="8" fill="#080D16" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">Google Sheets API</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Cloud Spreadsheet Sync</text>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">Live Business Reporting</text>
      <circle cx="156" cy="20" r="4" fill="#10B981" />
    </g>

    <!-- Destination 3: CSV Flat Files -->
    <g transform="translate(18, 218)">
      <rect width="174" height="68" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="12" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">CSV Flat File</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Clean Dataset Backup</text>
      <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Offline Downstream Analytics</text>
      <circle cx="156" cy="20" r="4" fill="#94A3B8" />
    </g>

    <text x="18" y="312" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#34D399">✓ 3 Destinations Synced</text>
  </g>
</svg>

