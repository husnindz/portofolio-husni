<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="mirai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0B111D" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D2E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0E1422" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Ambient Accent -->
    <radialGradient id="ambient-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-emerald" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="800" height="450" fill="url(#mirai-bg)" rx="16" />
  <rect width="800" height="450" fill="url(#ambient-cyan)" rx="16" />
  <rect width="800" height="450" fill="url(#ambient-emerald)" rx="16" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.8">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Top Header Bar -->
  <g transform="translate(40, 36)">
    <!-- Brand / Status -->
    <rect x="0" y="0" width="10" height="10" rx="3" fill="#06B6D4" />
    <text x="20" y="9" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">MIRAI AI PLATFORM</text>
    <text x="160" y="9" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748B">// CLINICAL LAB FEATURE SELECTION &amp; SHAP EXPLAINABILITY</text>

    <!-- Badge -->
    <rect x="580" y="-4" width="140" height="22" rx="11" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="594" cy="7" r="3.5" fill="#10B981" />
    <text x="606" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00F2FE">3 RISK DOMAINS</text>
  </g>

  <!-- LEFT PANEL: Raw Lab Parameter Input Stream -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="210" height="330" rx="12" fill="url(#card-grad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    
    <text x="20" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Lab Parameters</text>
    <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Medical Check-up Ingestion</text>

    <!-- Lab Feature 1: Glucose / HbA1c -->
    <g transform="translate(20, 68)">
      <rect width="170" height="42" rx="8" fill="#080D16" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F8FAFC">GLUCOSE / HbA1c</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">118 mg/dL · Borderline</text>
      <circle cx="152" cy="21" r="5" fill="#10B981" fill-opacity="0.2" />
      <circle cx="152" cy="21" r="2.5" fill="#10B981" />
    </g>

    <!-- Lab Feature 2: Cholesterol LDL / HDL -->
    <g transform="translate(20, 120)">
      <rect width="170" height="42" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F8FAFC">CHOLESTEROL LDL</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F59E0B">162 mg/dL · Elevated</text>
      <circle cx="152" cy="21" r="5" fill="#F59E0B" fill-opacity="0.2" />
      <circle cx="152" cy="21" r="2.5" fill="#F59E0B" />
    </g>

    <!-- Lab Feature 3: Blood Pressure & ECG -->
    <g transform="translate(20, 172)">
      <rect width="170" height="42" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F8FAFC">SYSTOLIC / DIASTOLIC</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">134 / 86 mmHg</text>
      <circle cx="152" cy="21" r="5" fill="#06B6D4" fill-opacity="0.2" />
      <circle cx="152" cy="21" r="2.5" fill="#06B6D4" />
    </g>

    <!-- Lab Feature 4: Pulmonary / FEV1 -->
    <g transform="translate(20, 224)">
      <rect width="170" height="42" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F8FAFC">PULMONARY FEV1</text>
      <text x="12" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">88% Normal Index</text>
      <circle cx="152" cy="21" r="5" fill="#10B981" fill-opacity="0.2" />
      <circle cx="152" cy="21" r="2.5" fill="#10B981" />
    </g>

    <!-- Status pill -->
    <rect x="20" y="282" width="170" height="26" rx="6" fill="#06B6D4" fill-opacity="0.08" />
    <text x="32" y="299" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00F2FE">SMOTE Class Balance: OK</text>
  </g>

  <!-- CONNECTOR PIPELINE ARROWS (Left to Middle) -->
  <g opacity="0.8">
    <path d="M 250 150 L 290 190" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 250 215 L 290 215" fill="none" stroke="#00F2FE" stroke-width="2" />
    <path d="M 250 280 L 290 240" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- MIDDLE PANEL: Neural Feature Transformation & Model Comparison -->
  <g transform="translate(290, 75)" filter="url(#shadow)">
    <rect width="230" height="330" rx="12" fill="url(#card-grad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    
    <text x="20" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">ML Feature Engine</text>
    <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Data Science Pipeline</text>

    <!-- Feature Correlation Matrix Mini-Heatmap -->
    <g transform="translate(20, 68)">
      <rect width="190" height="110" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8">FEATURE CORRELATION MATRIX</text>
      
      <!-- Mini heatmap matrix cells -->
      <g transform="translate(12, 32)">
        <rect x="0" y="0" width="38" height="20" fill="#06B6D4" fill-opacity="0.85" rx="3" />
        <rect x="42" y="0" width="38" height="20" fill="#06B6D4" fill-opacity="0.4" rx="3" />
        <rect x="84" y="0" width="38" height="20" fill="#141C2E" rx="3" />
        <rect x="126" y="0" width="38" height="20" fill="#10B981" fill-opacity="0.6" rx="3" />

        <rect x="0" y="24" width="38" height="20" fill="#06B6D4" fill-opacity="0.3" rx="3" />
        <rect x="42" y="24" width="38" height="20" fill="#06B6D4" fill-opacity="0.9" rx="3" />
        <rect x="84" y="24" width="38" height="20" fill="#10B981" fill-opacity="0.7" rx="3" />
        <rect x="126" y="24" width="38" height="20" fill="#141C2E" rx="3" />

        <rect x="0" y="48" width="38" height="20" fill="#141C2E" rx="3" />
        <rect x="42" y="48" width="38" height="20" fill="#10B981" fill-opacity="0.5" rx="3" />
        <rect x="84" y="48" width="38" height="20" fill="#06B6D4" fill-opacity="0.75" rx="3" />
        <rect x="126" y="48" width="38" height="20" fill="#06B6D4" fill-opacity="0.85" rx="3" />
      </g>
    </g>

    <!-- Deep Neural / Classifier Stack -->
    <g transform="translate(20, 192)">
      <rect width="190" height="116" rx="8" fill="#080D16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#94A3B8">MODEL ARCHITECTURE</text>

      <g transform="translate(12, 34)">
        <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">Dense FeedForward (MLP)</text>
        <rect x="0" y="16" width="166" height="5" rx="2.5" fill="#141C2E" />
        <rect x="0" y="16" width="148" height="5" rx="2.5" fill="url(#cyan-glow)" />

        <text x="0" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F8FAFC">Scikit-learn Ensemble</text>
        <rect x="0" y="48" width="166" height="5" rx="2.5" fill="#141C2E" />
        <rect x="0" y="48" width="138" height="5" rx="2.5" fill="url(#emerald-glow)" />

        <text x="0" y="70" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">ROC-AUC: Optimized</text>
      </g>
    </g>
  </g>

  <!-- CONNECTOR PIPELINE ARROWS (Middle to Right) -->
  <g opacity="0.8">
    <path d="M 520 180 L 560 160" fill="none" stroke="#00F2FE" stroke-width="2" />
    <path d="M 520 230 L 560 230" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 520 280 L 560 300" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- RIGHT PANEL: SHAP Explainability & Risk Domain Classification -->
  <g transform="translate(560, 75)" filter="url(#shadow)">
    <rect width="200" height="330" rx="12" fill="url(#card-grad)" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    <text x="20" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">SHAP Explainability</text>
    <text x="20" y="48" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">Biomarker Feature Impact</text>

    <!-- SHAP Waterfall Bars -->
    <g transform="translate(20, 68)">
      <!-- Feature 1 -->
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Cholesterol Ratio</text>
      <text x="135" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00F2FE">+0.48</text>
      <rect x="0" y="16" width="160" height="6" rx="3" fill="#141C2E" />
      <rect x="0" y="16" width="128" height="6" rx="3" fill="#06B6D4" />

      <!-- Feature 2 -->
      <text x="0" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">HbA1c Glycated</text>
      <text x="135" y="38" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#00F2FE">+0.39</text>
      <rect x="0" y="44" width="160" height="6" rx="3" fill="#141C2E" />
      <rect x="0" y="44" width="105" height="6" rx="3" fill="#06B6D4" />

      <!-- Feature 3 -->
      <text x="0" y="66" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Systolic Baseline</text>
      <text x="135" y="66" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#10B981">+0.28</text>
      <rect x="0" y="72" width="160" height="6" rx="3" fill="#141C2E" />
      <rect x="0" y="72" width="76" height="6" rx="3" fill="#10B981" />

      <!-- Feature 4 -->
      <text x="0" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Lung Spirometry</text>
      <text x="135" y="94" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#10B981">-0.15</text>
      <rect x="0" y="100" width="160" height="6" rx="3" fill="#141C2E" />
      <rect x="0" y="100" width="40" height="6" rx="3" fill="#10B981" fill-opacity="0.7" />
    </g>

    <!-- Predicted Health-Risk Domain Cards -->
    <g transform="translate(20, 196)">
      <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#F8FAFC">IDENTIFIED RISK PROFILE</text>

      <g transform="translate(0, 18)">
        <rect width="160" height="36" rx="6" fill="#080D16" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1" />
        <text x="10" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">Cardiovascular</text>
        <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#06B6D4">Pattern Score: 78% (Elevated)</text>
      </g>

      <g transform="translate(0, 60)">
        <rect width="160" height="36" rx="6" fill="#080D16" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
        <text x="10" y="16" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#F8FAFC">Metabolic Internal</text>
        <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">Pattern Score: 32% (Low Risk)</text>
      </g>
    </g>
  </g>
</svg>
